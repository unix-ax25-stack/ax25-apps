# ax25tcpd.conf - configuration for the interactive AX.25 frontend

# Back side: taken from ax25netd's shared loop port configuration
# /etc/ax25/ax25common.conf, the very file the daemon reads for its
# listener.  One file, one semantics: 'loop socket' and 'loop tcp'
# decide how this frontend reaches the daemon.  There is nothing to
# write here for a netd on this host.
# For a netd on another host, an explicit 'target' line overrides:
#   target tcp 192.0.2.10 8200

# Front side.  One listen line opens one listener.  Whether a connection
# is ascii or binary is the client's decision, taken per connection, so
# there is no second port for the other mode: the daemon does not need to
# know how a client will be talking before it has been told.  8000 is the
# AGWPE server port of Direwolf, 8200 the ax25netd loop port, so the front
# ports live just above them.
# "localhost" opens the IPv4 and the IPv6 loopback; a literal 127.0.0.1
# or ::1 restricts it to that one address.
listen tcp localhost 8202
#listen tcp 0.0.0.0 8202
#listen tcp :: 8202

# A unix domain socket is ascii unless the client says "binary".
# The directory is created with the mode from 'loop mode' in
# ax25common.conf.
#listen unix /var/run/ax25/sockets/ax25tcpd.sock

# Datagram packets are split into chunks of this many bytes.  Only a
# binary datagram is chunked; in ascii every line is one frame.
mtu 256

# Source call used when the command line does not give one.
#default-call MYCALL

# Port used when a command names no port, so that "connect DB0AAA" is
# something.  The netd needs a port even to autoroute, which is why this
# is not just a shorter spelling of typing the port out.  Global, like
# default-call: a client picks its mode, but it does not pick what a
# missing port means.
# Unset by default, and then a command without a port is refused with a
# message naming this setting, rather than going out on a port nobody
# chose.
#default-port hf