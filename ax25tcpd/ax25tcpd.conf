# ax25tcpd.conf - configuration for the interactive AX.25 frontend

# Back side: taken from ax25netd's shared loop port configuration
# /etc/ax25/ax25common.conf, the very file the daemon reads for its
# listener.  One file, one semantics: 'loop socket' and 'loop tcp'
# decide how this frontend reaches the daemon.  There is nothing to
# write here for a netd on this host.
# For a netd on another host, an explicit 'target' line overrides:
#   target tcp 192.0.2.10 8200

# Front side.  Port X is the binary port (the whole stream is one
# packet), X+1 is the text port (each line is one packet): one listen
# line opens both.  8000 is the AGWPE server port of Direwolf, 8200 the
# ax25netd loop port, so the front ports live just above them.
listen tcp 127.0.0.1 8202
#listen tcp 0.0.0.0 8202

# A unix domain socket behaves like a text port.  The directory is
# created with the mode from 'loop mode' in ax25common.conf.
#listen unix /var/run/ax25/sockets/ax25tcpd.sock

# Datagram packets are split into chunks of this many bytes.
mtu 256

# Source call used when the command line does not give one.
#default-call MYCALL
