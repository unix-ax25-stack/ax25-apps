# Configuration of the ax25netd loop port, shared by ax25netd (the
# server) and its local clients (ax25tcpd, ax25tcpd's own listeners, the
# AGWPE shim in libax25).
#
# ax25netd listens on the loop port, the local clients connect to it.
# Configuring the endpoint once, in this file, keeps the two sides in
# sync: no per-tool duplication.
#
#   loop socket <path|no>     unix domain socket of the loop port
#                             (default: /var/run/ax25/sockets/ax25netd.sock)
#   loop tcp <port|yes|no>    TCP loop port, offered as well
#                             (default: no; 8100 when switched on)
#   loop group <name|gid|all|default>
#                             who may connect to the unix socket, and
#                             so which mode it gets
#                             (default: all, i.e. 0666 and every local
#                             account; a name or "default" gives 0660
#                             to that group)
#   loop mode <octal>         mode of the directory holding the socket
#                             (default: 1775, so other accounts can
#                             reach it; the sticky bit keeps one local
#                             account from renaming another's socket)
#
# A missing file is not an error and leaves the defaults in place.
#
# The defaults are a unix socket and no TCP port.  A TCP loop port is
# reachable by everything that can open a TCP connection to the host, and
# nothing else is needed to authenticate the peers on the other side of
# it - the local socket is not.  If you switch the TCP port on, treat it
# as a decision to publish the loop port to the network, and prefer
# "loop socket no" with it, or the two are the same service twice.
#
# Ports: 8000 is the AGWPE server port of a Direwolf upstream.  8100 is
# the ax25netd loop port if you switch it on.  ax25tcpd's own front ports
# live just above, on 8101 (binary) and 8102 (text).
#
# The local clients, all of which read this file:
#   ax25tcpd        connects to the loop port, and takes its target from
#                   here when ax25tcpd.conf names none
#   listen          the generic listener, for ax25tcpd
#   ax25netd        the server
#   the AGWPE shim  libax25, and so every program on it
# The WAMPES nodes are named in wampes.conf and are a separate path to
# the same upstreams.

#loop socket /var/run/ax25/sockets/ax25netd.sock
#loop tcp 8100
#loop group hams
#loop mode 1775
