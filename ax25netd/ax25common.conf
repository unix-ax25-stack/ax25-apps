# Configuration of the ax25netd loop port, shared by ax25netd (the
# server) and its local clients (ax25tcpd, the AGWPE shim).
#
# ax25netd listens on the loop port, the local clients connect to it.
# Configuring the endpoint once, in this file, keeps the two sides in
# sync: no per-tool duplication.
#
#   loop tcp <port|yes|no>    TCP loop port (default: yes, 8100)
#   loop socket <path|no>     unix domain socket of the loop port
#                             (default: none)
#   loop group <name|gid|all> who may connect to the unix socket
#                             (default: the daemon run user and its
#                             primary group)
#
# A missing file is not an error and leaves the defaults in place.
#
# Ports: 8000 is the AGWPE server port of a Direwolf upstream, 8100 the
# ax25netd loop port.  ax25tcpd's own front ports live just above, on
# 8101 (binary) and 8102 (text).

#loop tcp 8100
#loop socket /var/ax25/ax25netd.sock
#loop group hams
