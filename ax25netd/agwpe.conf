# Configuration for ax25netd.
#
# Each line defines one AGWPE upstream (a radio server speaking the
# AGWPE protocol, e.g. Direwolf, AGWPE on Windows, extmodem) which is
# exposed to clients on the local loop port as one port:
#   loop port 0  ->  the first upstream
#   loop port 1  ->  the second upstream
#   ...
#
# Format:  <name>  <host>  <tcp-port>  [description]
#
# host is an IPv4/IPv6 address or a host name; IPv6 literals may be
# bracketed ("[::1]").  A host starting with "/" is a unix domain
# socket instead of a TCP port; the tcp-port column is then ignored
# ("-" or absent):
#   radio_unix  /var/run/agwpe/radio.sock  -
#
# The reserved name "loop" enables the virtual loopback upstream
# (AGWPE port 255) used for local AX.25 services; it takes no host/port.
#
# Client authentication ("auth" directive, default "extern"):
#   auth  no        - trust every client, no login
#   auth  extern    - trust clients connecting over loopback (127.0.0.1,
#                     ::1); any other client must log in
#   auth  yes       - every client must log in, loopback included
#                     ("required" and "always" are synonyms)
# Credentials live in agwpe_shadow.conf (mode 0600) under the target
# name "ax25netd"; upstreams that require a login themselves (e.g. a
# second ax25netd in a chain) are configured there by upstream name.
#
# Automatic digipeater resolution ("autoroute" directive, default "yes"):
# connects that name no digipeaters ("connect port dest") ask the
# ax25rtd route cache for a learned path on that port first.  Connects
# with an explicit digipeater path ('v') are never touched.
#   autoroute  yes   - resolve (default, kernel AX.25 semantics)
#   autoroute  no    - always connect without digipeaters
#
# Comment lines and blank lines are ignored.

# auth        yes               # force a login from every client
# auth        extern            # trust loopback, login required elsewhere
# autoroute   yes               # resolve digipeater paths via ax25rtd

radio0	localhost	8000		# first radio
# radio1	192.168.1.20	8000		# second radio
loop	-	-			# local loopback upstream
